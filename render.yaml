# Consolidated DSU backend: API routes, business logic and database access in
# one service. Replaces the previous dsu-backend gateway + dsu-api pair.
services:
  - type: web
    name: dsu-backend
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_SSL
        value: true
      # Supabase CA, uploaded as a Render secret file. Never disable
      # verification and never use a machine-specific path here.
      - key: DATABASE_CA_PATH
        value: /etc/secrets/prod-ca-2021.crt
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ASSESSMENT_CODE_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STUDENT_AI_MODEL
        sync: false
      - key: STUDENT_AI_CONCURRENCY
        value: 2
      - key: SERVICE_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_POOL_MAX
        value: 5
      - key: RATE_LIMIT_MODE
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dsu-shared-limits
          property: connectionString
  - type: keyvalue
    name: dsu-shared-limits
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
