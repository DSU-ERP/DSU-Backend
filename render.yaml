# Consolidated DSU backend: API routes, business logic and database access in
# one service. Replaces the previous dsu-backend gateway + dsu-api pair.
services:
  - type: web
    name: dsu-backend
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_SSL
        value: true
      # Supabase CA, uploaded as a Render secret file. Never disable
      # verification and never use a machine-specific path here.
      - key: DATABASE_CA_PATH
        value: /etc/secrets/prod-ca-2021.crt
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ASSESSMENT_CODE_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STUDENT_AI_MODEL
        sync: false
      # Provider calls are network-bound; extra requests wait in a queue
      # (up to 25 s) instead of failing. Keep within OpenRouter rate limits.
      - key: STUDENT_AI_CONCURRENCY
        value: 4
      # Web research: set one provider key (or both). Empty keeps it disabled.
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_CX
        sync: false
      - key: WEB_SEARCH_PROVIDERS
        value: brave,google
      - key: WEB_SEARCH_TRANSPORT
        value: direct
      - key: SERVICE_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # API pool. The sync/ranking worker opens its own pool of 2 on top, so
      # keep (this + 2) within the Supabase session-pooler client limit.
      # Per-user cache of /session and the student record (ms). Role changes
      # reach page routing within this window; SQL authorization is immediate.
      - key: IDENTITY_CACHE_MS
        value: 15000
      - key: DATABASE_POOL_MAX
        value: 10
      - key: RATE_LIMIT_MODE
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dsu-shared-limits
          property: connectionString
  - type: keyvalue
    name: dsu-shared-limits
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
